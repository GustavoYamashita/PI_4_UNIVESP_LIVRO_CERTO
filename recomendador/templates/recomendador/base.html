<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Recomendador de Livros{% endblock %}</title>
    <style>
        body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0;
               background: #f7f7fb; color: #222; }
        header { background: #2b3a67; color: white; padding: 16px 24px; }
        header h1 { margin: 0; font-size: 20px; }
        nav { margin-top: 10px; }
        nav a { color: #cbd4f0; margin-right: 16px; text-decoration: none; font-size: 14px; }
        nav a:hover { color: white; }
        main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        .card { background: white; border-radius: 10px; padding: 20px;
                margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        h2 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
        th { background: #f0f2fa; }
        .metric { display: inline-block; padding: 10px 16px; margin: 6px 6px 0 0;
                  background: #eef3ff; border-radius: 8px; }
        .metric b { display: block; font-size: 22px; }
        button, input[type=submit] { background: #2b3a67; color: white; border: 0;
            padding: 10px 18px; border-radius: 8px; cursor: pointer; }
        button:hover { background: #1f2b4d; }
        label { display: block; margin: 12px 0 4px; font-weight: 600; }
        select, input[type=number], input[type=text] { padding: 8px; width: 100%;
            max-width: 400px; border: 1px solid #ccc; border-radius: 6px; }
        .hist { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { background: #e8ecf7; padding: 4px 10px; border-radius: 20px; font-size: 13px; }
        .muted { color: #777; font-size: 13px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>📚 Recomendador de Livros</h1>
        <nav>
            <a href="{% url 'recomendador:home' %}">Início</a>
            <a href="{% url 'recomendador:aluno_existente' %}">Aluno existente</a>
            <a href="{% url 'recomendador:aluno_novo' %}">Aluno novo</a>
            <a href="{% url 'recomendador:metricas' %}">Métricas</a>
            <a href="{% url 'recomendador:dados' %}">Dados & Clusters</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
